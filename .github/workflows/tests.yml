name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile zotero_sync_webdav.py zotero_storage_quota_audit.py
      - run: bash -n <(python -c "import zotero_sync_webdav as z; print(z.SETUP_AUTOSTART_SHELL)")
      - run: python -m unittest discover -s tests
