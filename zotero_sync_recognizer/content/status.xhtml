<?xml version="1.0"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <title>Status da sincronização Zotero</title>
  <script src="chrome://zotero/content/include.js"></script>
  <script src="status.js"></script>
  <style>
    :root { color-scheme: light dark; font: menu; }
    body { margin: 0; min-width: 430px; }
    main { display: grid; gap: 14px; padding: 20px; }
    h1 { font-size: 1.15rem; margin: 0; }
    #stage { color: #5b5b5b; min-height: 1.2em; }
    progress { width: 100%; height: 12px; }
    #progress-label, #counts, #details, #updated { margin: 0; }
    #counts { border-top: 1px solid #c8c8c8; padding-top: 12px; }
    #details { overflow-wrap: anywhere; }
    #updated { color: #6a6a6a; font-size: 0.9em; }
    footer { display: flex; justify-content: flex-end; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Carregando status…</h1>
    <div id="stage"></div>
    <progress id="progress" max="100" value="0"></progress>
    <p id="progress-label"></p>
    <p id="counts"></p>
    <p id="details"></p>
    <p id="updated"></p>
    <footer><button id="close" type="button">Fechar</button></footer>
  </main>
</body>
</html>
